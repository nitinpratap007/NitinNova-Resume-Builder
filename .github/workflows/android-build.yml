name: Android CI - Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK commandline tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build web assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy web assets to native project
        working-directory: frontend
        run: npx cap copy

      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > frontend/android/my-release-key.jks

      - name: Build Android release
        working-directory: frontend/android
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Sign and align APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: frontend/android/app/build/outputs/apk/release
        run: |
          mkdir -p out || true
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
          cp app-release-unsigned.apk out/app-release-unsigned.apk
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign -v -p 4 out/app-release-unsigned.apk out/app-release-unaligned.apk || true
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign --ks ../../../my-release-key.jks --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} --key-pass pass:${{ secrets.KEYSTORE_PASSWORD }} --out out/app-release-signed.apk out/app-release-unaligned.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-builder-apk
          path: frontend/android/app/build/outputs/apk/release/out/app-release-signed.apk
