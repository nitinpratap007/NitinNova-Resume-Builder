<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA fallback. Any deep link (/settings, /my-repo/dashboard)
      // lands here; forward to index.html with the matching hash route.
      // Unknown paths fall back to the welcome screen (index.html#/).
      (function () {
        var known = ['welcome', 'home', 'dashboard', 'cover-letter', 'settings', 'feedback', 'developer']
        var segs = location.pathname.split('/').filter(Boolean)
        var route = ''
        for (var i = segs.length - 1; i >= 0; i--) {
          var s = segs[i].replace(/\.html$/, '')
          if (known.indexOf(s) !== -1) {
            route = s
            break
          }
        }
        location.replace('index.html#/' + route)
      })()
    </script>
  </head>
  <body></body>
</html>
